<script>
const LV=[['warden','Warden'],['tutor','Tutor'],['hod','HOD'],['principal','Principal'],['hostel_security','Hostel security'],['gate_security','Main gate security']];
let U=[],newCreds=[],letterData=null,loginRole=null;const DEPTS=['AIDS','CYBER SECURITY','ECE','EEE','IT','CSE','MECH','AUTOMOBILE','CIVIL'];const G={student:['student'],warden:['warden'],tutor:['tutor'],hod:['hod'],principal:['principal'],security:['hostel_security','gate_security'],admin:['admin']};const letterHtml=r=>r.letter?`<details style="margin:8px 0"><summary style="min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600">Handwritten leave letter</summary><img src="${r.letter.data}" alt="Handwritten leave letter" style="max-width:100%;border-radius:10px"></details>`:'';const BH='Boys Hostel',GH='Girls Hostel';
const roleName=r=>r==='student'?'Student':r==='admin'?'Admin':LV.find(l=>l[0]===r)[1];
const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))),b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>{try{localStorage.setItem('outpass_v3',JSON.stringify({U,R,nid}))}catch(e){}};
const pw=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>c[b%c.length]).join('')};
async function mk(x,p){x.id=U.length+1;x.h=await sha(x.uid+':'+p);if(p==='pass@123')x.demo=true;U.push(x);return x}
// each approver only handles their own students: warden by hostel, tutor and HOD by department
const canSign=(u,r)=>{const s=user(r.sid),q=LV[r.level-1][0];return r.status==='pending'&&u.role===q&&(q==='warden'?u.hostel===s.hostel:(q==='tutor'||q==='hod')?u.dept===s.dept:true)};
const scope=(u,r)=>{const s=user(r.sid);return u.id===r.sid||['principal','hostel_security','gate_security'].includes(u.role)||(u.role==='warden'&&u.hostel===s.hostel)||(['tutor','hod'].includes(u.role)&&u.dept===s.dept)};
async function seed(){const P='pass@123';
 await mk({uid:'ADMIN',name:'Office Admin',role:'admin'},P);
 await mk({uid:'selvam@college.edu',name:'Mr. Selvam',role:'warden',hostel:BH},P);
 await mk({uid:'meena@college.edu',name:'Mrs. Meena Iyer',role:'warden',hostel:GH},P);

function check(r){const n=Date.now(),L=new Date(r.leave).getTime(),B=new Date(r.ret).getTime();
 if(r.status==='revoked')return{s:'bad',t:'INVALID',w:'Revoked by '+r.revBy};
 if(r.status==='rejected')return{s:'bad',t:'REJECTED',w:'Rejected at '+roleName(LV[r.level-1][0])};
 if(r.status==='pending')return{s:'warn',t:'NOT ISSUED',w:'Waiting for '+LV[r.level-1][1]};
 if(r.status==='returned')return{s:'bad',t:'USED',w:'Exit and return already logged'};
 if(r.status==='out')return n>B?{s:'warn',t:'OVERDUE',w:'Past return-by time',act:'return'}:{s:'ok',t:'VALID',w:'Student is out. Ready for return scan',act:'return'};
 if(n>B)return{s:'bad',t:'EXPIRED',w:'Never used before return-by time'};
 if(n<L&&!skipWin)return{s:'bad',t:'INVALID',w:'Not valid before '+fmt(r.leave)};
 return{s:'ok',t:'VALID',w:'Ready for exit scan',act:'exit'}}
const find=k=>{k=k.trim().split('#').pop().toUpperCase();return R.find(r=>r.token.toUpperCase()===k||r.code===k)};

 if(!a||a.h!==await sha(a.uid+':'+p)){e.textContent='ID or password is wrong. Check both and try again.';return}
 if(!G[loginRole].includes(a.role)){e.textContent='This is not a '+loginRole+' account. Go back and choose the right option.';return}

 if(!names.length){e.textContent='Add at least one name.';return}
 if(['student','tutor','hod'].includes(role)&&!dept){e.textContent='Enter the department, like CSE.';return}
 const sec=['hostel_security','gate_security'].includes(role),rows=names.map(l=>{const [n,em]=l.split(',').map(s=>s.trim());return{n,l,uid:(em||'').toLowerCase()}});
 if(!sec){const bad=rows.find(r=>!/^\S+@\S+\.\S+$/.test(r.uid)||U.some(u=>u.uid.toLowerCase()===r.uid));if(bad){e.textContent='Write one person per line as: Name, college email (not already registered). Check: '+bad.l;return}}
 const out=[];
 for(const r of rows){const p=pw(),uid=sec?(role==='gate_security'?'SEC-GATE-':'SEC-HOSTEL-')+(U.filter(u=>u.role===role).length+1):r.uid;
  const x={uid,name:r.n,role};if(role==='student'){x.dept=dept;x.hostel=host;x.room='';x.roll=uid.split('@')[0].toUpperCase()}if(role==='tutor'||role==='hod')x.dept=dept;if(role==='warden')x.hostel=host;

 if(!name||!roll||!em||!p||!dept||!host){e.textContent='Fill in every field.';return}
 if(!/^\S+@college\.edu$/.test(em)){e.textContent='Use your college email ending in @college.edu.';return}

window.submitReq=()=>{const g=i=>document.getElementById(i).value.trim();
 const d={type:g('f-type'),dest:g('f-dest'),reason:g('f-reason'),leave:g('f-leave'),ret:g('f-ret')};
 const e=document.getElementById('f-err');let m='';
 if(!d.dest||!d.reason||!d.leave||!d.ret)m='Fill in every field.';
 else if(!letterData)m='Attach a photo of your handwritten leave letter.';
 else if(new Date(d.ret)<=new Date(d.leave))m='Return time must be after leave time.';
 else if(d.type==='Day outing'&&(d.leave.slice(0,10)!==d.ret.slice(0,10)||d.ret.slice(11)>'21:00'))m='Day outpasses must end the same day before the 9:00 pm curfew.';
 else if(R.some(r=>r.sid===me.id&&['pending','approved','out'].includes(r.status)))m='You already have an open pass. Finish or wait for it first.';
 if(m){e.textContent=m;return}
 R.push({id:nid++,sid:me.id,...d,status:'pending',level:1,letter:letterData,trail:[],token:rnd(12),code:'GP'+(1000+Math.floor(Math.random()*9000)),outAt:null,inAt:null});
 letterData=null;toast('Request sent. Warden notified.');render()};
window.pickLetter=inp=>{const f=inp.files[0],m=document.getElementById('l-note');letterData=null;if(!f)return;
 if(!f.type.startsWith('image/')){m.textContent='Upload a photo of the letter (JPG or PNG).';return}
 const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);letterData={name:f.name,data:c.toDataURL('image/jpeg',.72)};m.textContent='Attached: '+f.name};im.onerror=()=>{m.textContent='Could not read that photo. Try another.'};im.src=URL.createObjectURL(f)};
window.decide=(id,ok)=>{const r=R.find(x=>x.id===id);if(!r||!canSign(me,r)){toast('You can’t sign this request.');return}
 const c=(document.getElementById('c'+id)||{}).value||'';

 toast(a==='exit'?'Exit logged.':'Return logged.');render()};

${letterHtml(r)}<label for="c${r.id}">Comment (required to reject)</label><input id="c${r.id}"><div class="row" style="margin-top:10px"><button onclick="decide(${r.id},true)">Approve</button><button class="bad" onclick="decide(${r.id},false)">Reject</button></div></div>`}).join('')||'<div class="card mute">Nothing waiting for you. New requests appear here when they reach your level.</div>'}
${sec?scanView():''}
${['warden','principal'].includes(me.role)?`<h2 style="margin-top:22px">Active passes</h2>${act.map(r=>`<div class="card row sp"><span>${esc(user(r.sid).name)} · ${esc(r.dest)} ${tagFor(r)}</span><button class="bad" onclick="revoke(${r.id})">Revoke</button></div>`).join('')||'<p class="mute">No active passes.</p>'}`:''}</div>`}

function actionsFor(r){const c=check(r);return`<div class="verdict ${c.s}"><div style="font:700 1.4rem Lexend">${c.t}</div>${esc(user(r.sid).name)} · ${esc(c.w)}</div>
${c.act?`<button onclick="mark(${r.id},'${c.act}')">${c.act==='exit'?'Mark exit':'Mark return'}</button>`:''}`}
function scanView(){const r=R.find(x=>x.id===scanId),out=R.filter(x=>x.status==='out');
 return`<h2 style="margin-top:22px">Scan a pass</h2><div class="card"><p class="mute" style="margin-top:0">Scan the QR with the camera, or type the backup code (like GP4821).</p>
<div class="row"><input id="code" placeholder="Backup code or pass link" style="flex:1;min-width:200px" aria-label="Backup code"><button onclick="scan()">Check pass</button></div>
<label class="row" style="font-weight:400"><input type="checkbox" ${skipWin?'checked':''} onchange="setSkip(this.checked)" style="width:20px;min-height:20px"> Demo: ignore the leave-time window</label>
${r?actionsFor(r):''}</div>
<h3>Outside now (${out.length})</h3>${out.length?`<table><tr><th>Student</th><th>Out at</th><th>Due</th></tr>${out.map(x=>`<tr><td>${esc(user(x.sid).name)}</td><td>${fmt(x.outAt)}</td><td>${fmt(x.ret)}</td></tr>`).join('')}</table>`:'<p class="mute">Nobody is outside.</p>'}`}

function passView(tok){const r=find(tok);
 if(!r)return`<div class="wrap"><div class="ticket"><div class="banner bad">INVALID</div><div class="tbody">This pass link doesn’t match any outpass.<br><button class="ghost" style="margin-top:12px" onclick="location.hash=''">Back</button></div></div></div>`;
 const s=user(r.sid),c=check(r),mineP=me&&me.id===r.sid,guard=me&&['hostel_security','gate_security'].includes(me.role),full=!!me&&scope(me,r),url=location.href.split('#')[0]+'#'+r.token;
 return`<div class="wrap"><button class="ghost" onclick="location.hash=''">Back</button>
<div class="ticket"><div class="banner ${c.s}">${c.t}<span>${esc(c.w)}</span></div>
<div class="tbody"><h2>${esc(s.name)}</h2>
${full?`<div class="mute">${s.roll} · ${s.hostel}, room ${s.room}</div>
<div class="kv"><div><small>Type</small>${esc(r.type)}</div><div><small>Destination</small>${esc(r.dest)}</div><div><small>Leave</small>${fmt(r.leave)}</div><div><small>Return by</small>${fmt(r.ret)}</div><div><small>Exit logged</small>${fmt(r.outAt)}</div><div><small>Return logged</small>${fmt(r.inAt)}</div></div>
<div class="mute">Reason: ${esc(r.reason)}</div>`:'<p class="mute">Sign in as security staff to see full details.</p>'}</div>
${mineP&&r.status!=='pending'&&r.status!=='rejected'?`<div class="perf"></div><div class="qr"><div class="box" id="qrbox"></div></div><div class="code">${r.code}</div><div class="row" style="justify-content:center;padding:12px"><button onclick="toggleFull()">Full-screen QR</button><button class="ghost" onclick="window.print()">Save as PDF</button></div>`:''}
${full?`<div class="perf"></div><div class="tbody"><h3>Approval trail</h3><ul class="trail">${LV.map((l,i)=>{const t=r.trail.find(x=>x.level===i+1);return`<li><span>${l[1]}</span><span class="mute">${t?esc(t.by)+' · '+fmt(t.at)+(t.decision==='rejected'?' (rejected)':''):'–'}</span></li>`}).join('')}</ul>
${guard?actionsFor(r):''}${me&&['warden','principal'].includes(me.role)&&['approved','out'].includes(r.status)?`<button class="bad" onclick="revoke(${r.id})">Revoke pass</button>`:''}</div>`:''}
</div></div>
${fullQR?`<div class="full" onclick="toggleFull()"><div id="qrfull"></div><div class="code">${r.code}</div><div>Tap to close</div></div>`:''}
<span hidden data-url="${esc(url)}"></span>`}

function render(){if(U.length)save();document.body.classList.toggle('isauth',!location.hash&&!me);const app=document.getElementById('app'),h=location.hash.slice(1);
 let body=!h&&!me?loginView():h?passView(h):me.role==='student'?studentView():me.role==='admin'?adminView():approverView();
 app.innerHTML=`<header class="top"><div class="wrap"><div class="logo"><i></i>Outpass</div><div class="row">${me?`<span class="av" aria-hidden="true">${esc(me.name.replace(/^(Dr|Prof|Mr|Mrs)\.\s*/,'').split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><span class="who2"><b>${esc(me.name)}</b><small>${roleName(me.role)}${me.dept?' · '+esc(me.dept):''}</small></span><button class="link" onclick="logout()">Sign out</button>`:''}<button class="link" onclick="theme()" aria-label="Toggle theme">Theme</button></div></div></header><main>${body}</main>`;
 const u=document.querySelector('[data-url]');
 if(u&&typeof QRCode!=='undefined'){const mk=(id,sz)=>{const e=document.getElementById(id);if(e)new QRCode(e,{text:u.dataset.url,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M})};mk('qrbox',200);mk('qrfull',Math.min(340,innerWidth-60))}}
addEventListener('hashchange',()=>{if(location.hash==='#admin-access'){loginRole='admin';location.hash='';return}fullQR=false;render()});
(async()=>{let ok=false;try{const d=JSON.parse(localStorage.getItem('outpass_v3')||'null');if(d&&d.U&&d.U.length){U=d.U;R=d.R||[];nid=d.nid||1;ok=true}}catch(e){}
 if(!ok)await seed();
 try{const s=sessionStorage.getItem('op_me');if(s)me=U.find(x=>x.uid===s)||null}catch(e){}
 if(location.hash==='#admin-access'){loginRole='admin';location.hash=''}
 render()})();
</script>
</body>
</html>
